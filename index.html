<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tải Lên Tệp Tin & Trình Phát Nhạc</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
      .header-section {
        grid-column: span 2;
      }
    }

    .header-section {
      text-align: center;
    }

    .header-section h1 {
      font-size: 1.8rem;
      background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header-section p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* Music Player Panel */
    .music-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .disc-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(45deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      animation: spin 6s linear infinite;
      animation-play-state: paused;
    }

    .disc-icon.playing {
      animation-play-state: running;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .track-details h3 {
      font-size: 1rem;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .track-details p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-play {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-play:hover {
      transform: scale(1.05);
    }

    .progress-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #818cf8;
      border-radius: 4px;
    }

    .time-text {
      font-size: 0.75rem;
      color: #94a3b8;
      min-width: 35px;
    }

    /* Dropzone Upload */
    .upload-card {
      background: rgba(15, 23, 42, 0.6);
      border: 2px dashed rgba(99, 102, 241, 0.4);
      border-radius: 16px;
      padding: 25px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .upload-card:hover, .upload-card.dragover {
      border-color: #818cf8;
      background: rgba(99, 102, 241, 0.1);
    }

    .upload-icon {
      font-size: 2.5rem;
      color: #818cf8;
      margin-bottom: 12px;
    }

    .upload-card h4 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .upload-card p {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    #fileInput {
      display: none;
    }

    /* File Section / List */
    .file-section {
      grid-column: span 1;
    }

    @media (min-width: 768px) {
      .file-section {
        grid-column: span 2;
      }
    }

    .file-section h3 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .file-list::-webkit-scrollbar {
      width: 6px;
    }

    .file-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .file-item {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .file-item:hover {
      background: rgba(30, 41, 59, 0.8);
    }

    .file-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .file-icon {
      font-size: 1.3rem;
      color: #38bdf8;
    }

    .file-icon.mp3 {
      color: #ec4899; /* Đổi màu hồng cho file nhạc MP3 */
    }

    .file-details {
      overflow: hidden;
    }

    .file-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 350px;
    }

    .file-size {
      font-size: 0.75rem;
      color: #64748b;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 5px;
      transition: opacity 0.2s;
    }

    .btn-play-file {
      color: #38bdf8;
    }

    .btn-remove {
      color: #ef4444;
    }

    .btn-action:hover {
      opacity: 0.8;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header-section">
      <h1><i class="fa-solid fa-cloud-arrow-up"></i> Quản Lý Tệp Tin & Nhạc</h1>
      <p>Kéo thả tệp bất kỳ hoặc tải lên file nhạc .mp3 để phát trực tiếp</p>
    </div>

    <!-- Music Player Card -->
    <div class="music-card">
      <div class="music-info">
        <div class="disc-icon" id="discIcon">
          <i class="fa-solid fa-music"></i>
        </div>
        <div class="track-details">
          <h3 id="trackTitle">Chưa có bài hát</h3>
          <p id="trackStatus">Đang dừng</p>
        </div>
      </div>
      
      <div class="audio-controls">
        <button class="btn-play" id="playBtn" onclick="togglePlay()">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
        <div class="progress-container">
          <span class="time-text" id="currentTime">00:00</span>
          <div class="progress-bar" id="progressBar" onclick="setProgress(event)">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time-text" id="duration">00:00</span>
        </div>
      </div>

      <audio id="audioPlayer"></audio>
    </div>

    <!-- Upload Dropzone -->
    <div class="upload-card" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <i class="fa-solid fa-folder-open upload-icon"></i>
      <h4>Tải lên tệp mới (Hỗ trợ .mp3)</h4>
      <p>Nhấp vào đây hoặc kéo file thả vào khu vực này</p>
      <input type="file" id="fileInput" multiple accept="*/*" onchange="handleFiles(this.files)">
    </div>

    <!-- File Management List -->
    <div class="file-section">
      <h3><i class="fa-solid fa-list-check"></i> Danh Sách Tệp (<span id="fileCount">0</span>)</h3>
      <div class="file-list" id="fileList">
        <div class="empty-state" id="emptyState">Chưa có tệp nào được tải lên</div>
      </div>
    </div>
  </div>

  <script>
    const uploadedFiles = [];
    const audio = document.getElementById('audioPlayer');
    const playIcon = document.getElementById('playIcon');
    const discIcon = document.getElementById('discIcon');
    const trackTitle = document.getElementById('trackTitle');
    const trackStatus = document.getElementById('trackStatus');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    // Quản lý Trình Phát Nhạc Chính
    function togglePlay() {
      if (!audio.src) {
        alert("Vui lòng chọn một file nhạc MP3 trong danh sách để phát!");
        return;
      }
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
        discIcon.classList.add('playing');
        trackStatus.innerText = 'Đang phát...';
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
        discIcon.classList.remove('playing');
        trackStatus.innerText = 'Tạm dừng';
      }
    }

    function playSpecificFile(index) {
      const file = uploadedFiles[index];
      // Tạo URL nội bộ để trình duyệt đọc file máy tính
      const fileURL = URL.createObjectURL(file);
      
      audio.src = fileURL;
      audio.play();
      
      playIcon.className = 'fa-solid fa-pause';
      discIcon.classList.add('playing');
      trackTitle.innerText = file.name;
      trackStatus.innerText = 'Đang phát...';
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = percent + '%';
        currentTimeEl.innerText = formatTime(audio.currentTime);
        durationEl.innerText = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', () => {
      playIcon.className = 'fa-solid fa-play';
      discIcon.classList.remove('playing');
      trackStatus.innerText = 'Đã kết thúc';
    });

    function setProgress(e) {
      const width = e.currentTarget.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      if (duration) {
        audio.currentTime = (clickX / width) * duration;
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Quản lý Tải Lên Tệp Tin
    const dropzone = document.getElementById('dropzone');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      }, false);
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      handleFiles(files);
    });

    function handleFiles(files) {
      for (let i = 0; i < files.length; i++) {
        uploadedFiles.push(files[i]);
      }
      renderFileList();
    }

    function removeFile(index) {
      uploadedFiles.splice(index, 1);
      renderFileList();
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function renderFileList() {
      const fileListEl = document.getElementById('fileList');
      const fileCountEl = document.getElementById('fileCount');
      fileCountEl.innerText = uploadedFiles.length;

      if (uploadedFiles.length === 0) {
        fileListEl.innerHTML = '<div class="empty-state">Chưa có tệp nào được tải lên</div>';
        return;
      }

      fileListEl.innerHTML = '';
      uploadedFiles.forEach((file, index) => {
        const isMp3 = file.name.endsWith('.mp3') || file.type === 'audio/mpeg';
        const item = document.createElement('div');
        item.className = 'file-item';
        
        item.innerHTML = `
          <div class="file-info-left">
            <i class="fa-solid ${isMp3 ? 'fa-file-audio mp3' : 'fa-file-code'} file-icon"></i>
            <div class="file-details">
              <div class="file-name" title="${file.name}">${file.name}</div>
              <div class="file-size">${formatBytes(file.size)}</div>
            </div>
          </div>
          <div class="file-actions">
            ${isMp3 ? `<button class="btn-action btn-play-file" onclick="playSpecificFile(${index})" title="Phát bài này"><i class="fa-solid fa-play"></i></button>` : ''}
            <button class="btn-action btn-remove" onclick="removeFile(${index})" title="Xóa file"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        fileListEl.appendChild(item);
      });
    }
  </script>
</body>
</html>
